# Simple PostgreSQL Docker Compose for Development
# Use this file to run just PostgreSQL for your Spring Boot application
version: '3.8'

services:
  # PostgreSQL Database Only
  postgres:
    image: postgres:15-alpine
    container_name: smartshoe-postgres-dev
    environment:
      POSTGRES_DB: smartshoe
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      # Optional: Add init scripts
      # - ./database/init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smartshoe"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    command: >
      postgres 
      -c log_statement=all 
      -c log_destination=stderr 
      -c log_min_error_statement=error 
      -c log_min_messages=warning 
      -c log_min_duration_statement=1000

  # Optional: pgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: smartshoe-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@smartshoe.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres_dev_data:
    driver: local
  pgadmin_data:
    driver: local