# =============================================================================
# CORS CONFIGURATION PROPERTIES
# =============================================================================
# These properties can be used to configure CORS settings externally

# Allowed origins (comma-separated)
cors.allowed-origins=http://13.201.120.175,http://13.201.120.175:3000,https://13.201.120.175,https://13.201.120.175:3000,http://localhost:3000,http://localhost:5173,http://localhost:8080,http://127.0.0.1:3000,http://127.0.0.1:5173

# Allowed methods (comma-separated)
cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS,HEAD

# Allowed headers (comma-separated or * for all)
cors.allowed-headers=*

# Exposed headers (comma-separated)
cors.exposed-headers=Authorization,Content-Disposition,Access-Control-Allow-Origin,Access-Control-Allow-Credentials

# Allow credentials
cors.allow-credentials=true

# Max age for preflight cache (seconds)
cors.max-age=3600

# Mobile app origin patterns (comma-separated)
cors.mobile-origin-patterns=capacitor://*,ionic://*,file://*