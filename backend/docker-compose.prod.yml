# ====================================================================
# PRODUCTION DOCKER COMPOSE FOR SMART SHOE API
# Includes PostgreSQL, Redis, Monitoring, and Security
# ====================================================================

version: '3.8'

services:
  # ====================================================================
  # SMART SHOE API APPLICATION
  # ====================================================================
  smartshoe-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: smartshoe/api:3.0.0
    container_name: smartshoe-api-prod
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    environment:
      # Spring Boot Configuration
      SPRING_PROFILES_ACTIVE: production
      SERVER_PORT: 8080
      
      # Database Configuration
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/smartshoe_prod
      SPRING_DATASOURCE_USERNAME: smartshoe_user
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-SmartShoe2024!}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      
      # JPA Configuration
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_JPA_SHOW_SQL: false
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      
      # Redis Configuration
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD:-RedisSmartShoe2024!}
      
      # Security Configuration
      JWT_SECRET: ${JWT_SECRET:-YourSuperSecretJWTKeyForProductionUse2024!}
      JWT_EXPIRATION: 86400000
      
      # Logging Configuration
      LOGGING_LEVEL_ROOT: INFO
      LOGGING_LEVEL_COM_SMARTSHOE: DEBUG
      LOGGING_FILE_NAME: /app/logs/smartshoe-api.log
      
      # Health Check Configuration
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,metrics,prometheus
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: when_authorized
      MANAGEMENT_METRICS_EXPORT_PROMETHEUS_ENABLED: true
      
      # JVM Configuration
      JAVA_OPTS: >-
        -server
        -Xmx1g
        -Xms512m
        -XX:+UseG1GC
        -XX:+UseStringDeduplication
        -XX:MaxGCPauseMillis=200
        -XX:+HeapDumpOnOutOfMemoryError
        -XX:HeapDumpPath=/app/logs/
        -XX:+UseContainerSupport
        -XX:MaxRAMPercentage=75.0
        -Djava.security.egd=file:/dev/./urandom
    ports:
      - "8080:8080"
    volumes:
      - smartshoe_logs:/app/logs
      - smartshoe_data:/app/data
    networks:
      - smartshoe-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 1.5G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'

  # ====================================================================
  # POSTGRESQL DATABASE
  # ====================================================================
  postgres:
    image: postgres:15-alpine
    container_name: smartshoe-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: smartshoe_prod
      POSTGRES_USER: smartshoe_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-SmartShoe2024!}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    networks:
      - smartshoe-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartshoe_user -d smartshoe_prod"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

  # ====================================================================
  # REDIS CACHE
  # ====================================================================
  redis:
    image: redis:7-alpine
    container_name: smartshoe-redis-prod
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-RedisSmartShoe2024!}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - smartshoe-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-RedisSmartShoe2024!}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.25'
        reservations:
          memory: 128M
          cpus: '0.1'

  # ====================================================================
  # NGINX REVERSE PROXY
  # ====================================================================
  nginx:
    image: nginx:alpine
    container_name: smartshoe-nginx-prod
    restart: unless-stopped
    depends_on:
      - smartshoe-api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./docker/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    networks:
      - smartshoe-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
        reservations:
          memory: 64M
          cpus: '0.1'

  # ====================================================================
  # PROMETHEUS MONITORING
  # ====================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: smartshoe-prometheus-prod
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    networks:
      - smartshoe-network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

  # ====================================================================
  # GRAFANA DASHBOARD
  # ====================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: smartshoe-grafana-prod
    restart: unless-stopped
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-GrafanaSmartShoe2024!}
      GF_USERS_ALLOW_SIGN_UP: false
      GF_USERS_ALLOW_ORG_CREATE: false
      GF_INSTALL_PLUGINS: grafana-clock-panel,grafana-simple-json-datasource
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./docker/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - smartshoe-network
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 128M
          cpus: '0.1'

# ====================================================================
# NETWORKS
# ====================================================================
networks:
  smartshoe-network:
    driver: bridge
    name: smartshoe-prod-network

# ====================================================================
# VOLUMES
# ====================================================================
volumes:
  postgres_data:
    name: smartshoe-postgres-data
  redis_data:
    name: smartshoe-redis-data
  smartshoe_logs:
    name: smartshoe-logs
  smartshoe_data:
    name: smartshoe-data
  nginx_logs:
    name: smartshoe-nginx-logs
  prometheus_data:
    name: smartshoe-prometheus-data
  grafana_data:
    name: smartshoe-grafana-data